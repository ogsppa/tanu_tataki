[project]
name = "tanufre-whack"
version = "0.1.0"
description = "Projector-friendly whack-a-mole style game prototype with replaceable input providers."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pygame>=2.5.0",
]

[project.scripts]
tanufre-whack = "tanufre_whack.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tanufre_whack"]
